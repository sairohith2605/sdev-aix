[project]
name = "sdev-aix-backend"
version = "0.1.0"
description = "FastAPI backend for sdev-aix"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0",
  "dulwich>=1.2.15",
  "fastapi>=0.115.0",
  "github-copilot-sdk>=1.0.14,<1.1",
  "httpx>=0.28.0",
  "langgraph>=1.2.12",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "pydantic-settings>=2.7.0",
  "tree-sitter==0.25.2",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
