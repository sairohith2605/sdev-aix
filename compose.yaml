name: sdev-aix

services:
  init-key:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.init_compose_key"]
    volumes:
      - backend-data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 20
    mem_limit: 128m
    cpus: 0.5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      DATABASE_URL: sqlite:////data/sdev-aix.db
      CREDENTIAL_ENCRYPTION_KEY_FILE: /data/credential_encryption_key
      ADO_API_VERSION: ${ADO_API_VERSION:-7.1}
      ADO_REQUEST_TIMEOUT_SECONDS: ${ADO_REQUEST_TIMEOUT_SECONDS:-15}
    volumes:
      - backend-data:/data
    depends_on:
      init-key:
        condition: service_completed_successfully
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK_API: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=0750
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
    driver: bridge

volumes:
  backend-data:
